[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kernelpilot"
version = "0.1.0"
description = "Personal GPU kernel optimization agent harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Cross-platform: needed by spawn.py / scripts orchestration on any host.
    "numpy>=1.24.0",
    "ninja",
    "packaging>=24.2",
    "einops",
    "tabulate",
    "tqdm",
    "click",
    # TOML parsing on Python 3.10: tomllib is stdlib only on 3.11+, so spawn.py
    # and the scripts import-guard fall back to `import tomli`. Declare it so a
    # clean 3.10 install actually has it. (Modal runs 3.12, so this is host-only.)
    "tomli; python_version < '3.11'",
    # torch has macOS arm64 wheels; keep unconditional so orchestration imports work.
    "torch>=2.9.1",
]

[project.optional-dependencies]
kernelbench = [
    # Pin the KernelBench revision used by the adapter.
    "KernelBench @ git+https://github.com/ScalingIntelligence/KernelBench.git@423217d",
    "triton==3.5.1; sys_platform == 'linux'",
    "litellm==1.80.0",
]
modal = ["modal>=1.3.0"]
tilelang = ["tilelang", "cuda-tile"]
cutlass-dsl = ["nvidia-cutlass-dsl>=4.3.4"]
# Optional DeepGEMM dependency for a FlashInfer expert baseline.
# It is not required by the documented KernelBench + SSH path.
# Install this extra only when measuring that optional baseline.
#
# IMPORTANT: pip must use `--no-build-isolation` because deep-gemm's build
# links against the current env's torch, which pip's default isolated build
# env doesn't see. Install with:
#
#   pip install --no-build-isolation ".[deep-gemm]"
#
# (or pre-install torch + ninja in the isolated env by other means.)
deep-gemm = ["deep_gemm @ git+https://github.com/deepseek-ai/DeepGEMM.git@main ; sys_platform == 'linux'"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "ako4x", "agent_runtime", "benchmark_backend", "campaign",
    "experience_memory", "harness_evolution", "master",
]
